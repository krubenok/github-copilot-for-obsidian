name: Lint & format

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "latest"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build
              run: bun run build

            - name: Lint (includes typecheck)
              run: bun run lint

            - name: Format
              run: bun run format

            - name: Ensure no formatting changes
              run: git diff --exit-code
